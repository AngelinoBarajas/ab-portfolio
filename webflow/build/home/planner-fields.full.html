<style>.ab_planner_field{border:0;margin:0;padding:0;min-width:0}.ab_planner_legend{display:flex;gap:10px;width:100%;margin:0 0 10px;padding:0;font-family:var(--_typography---font--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--_color---text--tertiary)}.ab_planner_legend em{font-style:normal;color:var(--_color---brand--signal);margin-left:auto}.ab_planner_chips{display:flex;flex-wrap:wrap;gap:6px}.ab_planner_chip{--c:var(--_color---brand--signal);display:inline-flex;align-items:center;gap:8px;margin:0;padding:9px 12px;border:1px solid var(--_color---neutral--hair-strong);border-radius:0;background:transparent;font-family:var(--_typography---font--mono);font-size:12px;line-height:1.2;color:var(--_color---text--secondary);cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .2s}.ab_planner_chip::before{content:"";width:9px;height:9px;border:1.5px solid var(--c);transition:background .2s}.ab_planner_chip:hover{color:var(--_color---text--primary);border-color:var(--c)}.ab_planner_chip[aria-pressed="true"]{color:var(--_color---text--primary);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}.ab_planner_chip[aria-pressed="true"]::before{background:var(--c)}.ab_planner_chip:focus-visible{outline:2px solid var(--_color---ui--select);outline-offset:2px}.ab_planner_seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--_color---neutral--hair-strong)}.ab_planner_seg label{position:relative;margin:0;cursor:pointer;font-weight:400}.ab_planner_seg input{position:absolute;opacity:0;pointer-events:none}.ab_planner_seg span{display:block;padding:10px 6px;border-right:1px solid var(--_color---neutral--hair);text-align:center;font-family:var(--_typography---font--mono);font-size:11.5px;color:var(--_color---text--tertiary);transition:background .2s,color .2s}.ab_planner_seg label:last-child span{border-right:0}.ab_planner_seg input:checked+span{background:var(--_color---brand--signal);color:var(--_color---brand--on-signal)}.ab_planner_seg input:focus-visible+span{outline:2px solid var(--_color---ui--select);outline-offset:-2px}.ab_planner_seg label:hover span{color:var(--_color---text--primary)}.ab_planner_seg input:checked+span:hover{color:var(--_color---brand--on-signal)}.ab_planner_range{width:100%;height:26px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}.ab_planner_range::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--_color---brand--signal) var(--p,66%),var(--_color---neutral--hair-strong) var(--p,66%))}.ab_planner_range::-moz-range-track{height:2px;background:var(--_color---neutral--hair-strong)}.ab_planner_range::-moz-range-progress{height:2px;background:var(--_color---brand--signal)}.ab_planner_range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;background:var(--_color---brand--signal);border:3px solid var(--_color---neutral--void);box-shadow:0 0 0 1px var(--_color---brand--signal)}.ab_planner_range::-moz-range-thumb{width:14px;height:14px;background:var(--_color---brand--signal);border:3px solid var(--_color---neutral--void);border-radius:0}.ab_planner_range:focus-visible{outline:2px solid var(--_color---ui--select);outline-offset:4px}.ab_planner_ticks{display:flex;justify-content:space-between;margin-top:2px;font-family:var(--_typography---font--mono);font-size:10.5px;color:var(--_color---text--tertiary)}.ab_planner_row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ab_planner_in{display:flex;flex-direction:column;gap:6px;margin:0;font-weight:400}.ab_planner_in>span{font-family:var(--_typography---font--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--_color---text--tertiary)}.ab_planner_in input{box-sizing:border-box;width:100%;height:auto;margin:0;padding:12px;border:1px solid var(--_color---neutral--hair-strong);border-radius:0;background:rgba(7,8,13,.6);font-family:var(--_ set><fieldset class="ab_planner_field"><legend class="ab_planner_legend">03 · Budget orbit <em id="plBudOut">$10–25k</em></legend><input type="range" class="ab_planner_range" id="plBud" min="0" max="3" step="1" value="2" aria-label="Budget range" aria-valuetext="$10–25k"><input type="hidden" name="Budget" id="plBudField" value="$10–25k"><div class="ab_planner_ticks" aria-hidden="true"><span>&lt;$5k</span><span>$5–10k</span><span>$10–25k</span><span>$25k+</span></div></fieldset><div class="ab_planner_row"><label class="ab_planner_in"><span>Name</span><input type="text" name="Name" id="plName" autocomplete="name" placeholder="Ada Lovelace"></label><label class="ab_planner_in"><span>Email</span><input type="email" name="Email" id="plEmail" autocomplete="email" placeholder="you@company.com" required></label></div><label class="ab_planner_in"><span>One line about the mission</span><input type="text" name="Mission" id="plMsg" maxlength="140" placeholder="A site that feels like our product"></label><input type="hidden" name="Flight plan" id="plBriefField" value="">
