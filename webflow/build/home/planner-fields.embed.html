<fieldset class="ab_planner_field"><legend class="ab_planner_legend">01 · Mission type <em>pick any</em></legend><div class="ab_planner_chips" id="plTypes"><button type="button" class="ab_planner_chip" data-c="#146EF5" aria-pressed="false">Website</button><button type="button" class="ab_planner_chip" data-c="#FF6A3D" aria-pressed="false">Branding + logo</button><button type="button" class="ab_planner_chip" data-c="#0AE448" aria-pressed="false">Motion + interaction</button><button type="button" class="ab_planner_chip" data-c="#7C5CFF" aria-pressed="false">WebGL + 3D</button><button type="button" class="ab_planner_chip" data-c="#F9A03C" aria-pressed="false">CMS + integrations</button><button type="button" class="ab_planner_chip" data-c="#FF98A2" aria-pressed="false">Web app</button></div><input type="hidden" name="Mission types" id="plTypesField" value=""></fieldset>
<fieldset class="ab_planner_field"><legend class="ab_planner_legend">02 · Launch window</legend><div class="ab_planner_seg" id="plWin"><label><input type="radio" name="Launch window" value="ASAP" data-i="0"><span>ASAP</span></label><label><input type="radio" name="Launch window" value="1–2 months" data-i="1" checked><span>1–2 months</span></label><label><input type="radio" name="Launch window" value="3+ months" data-i="2"><span>3+ months</span></label><label><input type="radio" name="Launch window" value="Flexible" data-i="3"><span>Flexible</span></label></div></fieldset>
<fieldset class="ab_planner_field"><legend class="ab_planner_legend">03 · Budget orbit <em id="plBudOut">$10–25k</em></legend><input type="range" class="ab_planner_range" id="plBud" min="0" max="3" step="1" value="2" aria-label="Budget range" aria-valuetext="$10–25k"><input type="hidden" name="Budget" id="plBudField" value="$10–25k"><div class="ab_planner_ticks" aria-hidden="true"><span>&lt;$5k</span><span>$5–10k</span><span>$10–25k</span><span>$25k+</span></div></fieldset>
<div class="ab_planner_row"><label class="ab_planner_in"><span>Name</span><input type="text" name="Name" id="plName" autocomplete="name" placeholder="Ada Lovelace"></label><label class="ab_planner_in"><span>Email</span><input type="email" name="Email" id="plEmail" autocomplete="email" placeholder="you@company.com" required></label></div>
<label class="ab_planner_in"><span>One line about the mission</span><input type="text" name="Mission" id="plMsg" maxlength="140" placeholder="A site that feels like our product"></label>
<input type="hidden" name="Flight plan" id="plBriefField" value="">
