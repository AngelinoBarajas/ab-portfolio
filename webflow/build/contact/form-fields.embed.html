<div class="abc-form">
  <div class="abc-tuner">
    <div class="abc-tuner-h"><span class="abc-fl" id="abcTunL">01 · Tune the frequency</span><span class="abc-read"><b data-ct-freq>101.4</b> MHz</span></div>
    <div class="abc-band" data-ct-band aria-hidden="true"></div>
    <div class="abc-chips" data-ct-chips role="group" aria-labelledby="abcTunL"></div>
    <p class="abc-hint" data-ct-hint aria-live="polite"></p>
  </div>
  <div class="abc-row2">
    <label><span class="abc-fl">02 · Name</span><input class="abc-in" type="text" name="Name" autocomplete="name" required></label>
    <label><span class="abc-fl">03 · Email</span><input class="abc-in" type="email" name="Email" autocomplete="email" required></label>
  </div>
  <label><span class="abc-fl">04 · <span data-ct-msgl>What are you launching?</span></span><textarea class="abc-in" name="Message" data-ct-msg placeholder="A few lines about the project, the audience and the date you have in mind."></textarea></label>
  <input type="hidden" name="Reason" value="New project" data-ct-reason>
  <div class="abc-err" data-ct-err role="alert"></div>
  <div class="abc-go"><input type="submit" class="button is-primary" value="Transmit →" data-wait="Transmitting…"><span class="abc-go-n">Same desk as the planner · one reply, no newsletter</span></div>
</div>
