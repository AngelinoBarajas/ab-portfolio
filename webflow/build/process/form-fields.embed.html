<div class="abp-form">
  <div>
    <span class="abp-fl" id="abpChipsL">Destinations · up to three stops</span>
    <div class="abp-chips" data-chips role="group" aria-labelledby="abpChipsL"></div>
    <div class="abp-more" id="abpMore" data-more hidden><label><span class="abp-fl">More stops</span><textarea class="abp-in" name="More services" rows="3" placeholder="What else is on the manifest? List any other services you need."></textarea></label></div>
  </div>
  <div class="abp-row2">
    <label><span class="abp-fl">Name</span><input class="abp-in" type="text" name="Name" autocomplete="name" required></label>
    <label><span class="abp-fl">Email</span><input class="abp-in" type="email" name="Email" autocomplete="email" required></label>
  </div>
  <label><span class="abp-fl">Budget</span><select class="abp-in" name="Budget"><option>&lt; $20k</option><option selected>$20–40k</option><option>$40–60k</option><option>$60–80k</option><option>$80–100k</option><option>Not sure yet · still scouting</option></select></label>
  <label><span class="abp-fl">What are you launching?</span><textarea class="abp-in" name="Brief" placeholder="A few lines about the project, the audience and the date you have in mind."></textarea></label>
  <input type="hidden" name="Destinations" value="Webflow development" data-dest-field>
  <input type="submit" class="button is-primary" value="Launch the mission →" data-wait="Launching…">
</div>
